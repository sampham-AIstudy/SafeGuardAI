<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1710" viewBox="0 0 2000 1710">
<title>Engine workflow architecture — proposal</title>
<desc>Code-controlled workflow with conditional attachment processing, context and result guards,
scoped conversation state, and explicit failure outcomes. Only intake and observed history are implemented.</desc>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L11,6 L1,11 Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#172633} .title{font-size:36px;font-weight:700} .heading{font-size:24px;font-weight:700} .body{font-size:21px} .small{font-size:18px} .muted{fill:#52616d}</style>
<rect width="2000" height="1710" fill="#ffffff"/>

<text x="35" y="52" class="title" text-anchor="start">
<tspan x="35" dy="0">Engine workflow architecture</tspan>
</text>
<text x="35" y="87" class="body" text-anchor="start">
<tspan x="35" dy="0">PROPOSAL — internal detail of the Engine block</tspan>
</text>
<text x="35" y="117" class="small" text-anchor="start">
<tspan x="35" dy="0">Solid: processing flow    Dashed: state / original-byte access</tspan>
</text>
<rect x="20" y="180" width="1400" height="1285" rx="26" fill="#fbfcfe" stroke="#9daebb" stroke-width="2"/>
<text x="45" y="217" class="heading" text-anchor="start">
<tspan x="45" dy="0">ENGINE · code-controlled workflow</tspan>
</text>
<g id="norm"><rect x="1010" y="50" width="420" height="105" rx="19" fill="#dcefd6" stroke="#659951" stroke-width="2.5"/>
<text x="1220.0" y="85" class="heading" text-anchor="middle">
<tspan x="1220.0" dy="0">Norm output</tspan>
</text>
<text x="1220.0" y="115" class="small" text-anchor="middle">
<tspan x="1220.0" dy="0">Normalized message</tspan>
<tspan x="1220.0" dy="25">+ original-file references</tspan>
</text>
</g>
<g id="asset-store"><rect x="1500" y="240" width="460" height="210" rx="19" fill="#edf1f5" stroke="#8797a5" stroke-width="2.5"/>
<text x="1730.0" y="275" class="heading" text-anchor="middle">
<tspan x="1730.0" dy="0">Original-file store</tspan>
</text>
<text x="1730.0" y="305" class="small" text-anchor="middle">
<tspan x="1730.0" dy="0">Original bytes, separate from messages</tspan>
<tspan x="1730.0" dy="25">Scoped access + actual size / hash</tspan>
<tspan x="1730.0" dy="25">Temporary local backend implemented</tspan>
</text>
</g>
<rect x="1500" y="645" width="460" height="670" rx="24" fill="#f4f7fb" stroke="#8396ae" stroke-width="2.5"/>
<text x="1730" y="686" class="heading" text-anchor="middle">
<tspan x="1730" dy="0">Conversation Status</tspan>
</text>
<g id="observed-state"><rect x="1520" y="710" width="420" height="125" rx="19" fill="#e0efdf" stroke="#719a69" stroke-width="2.5"/>
<text x="1730.0" y="745" class="heading" text-anchor="middle">
<tspan x="1730.0" dy="0">Observed history</tspan>
</text>
<text x="1730.0" y="775" class="small" text-anchor="middle">
<tspan x="1730.0" dy="0">Exact messages + asset references</tspan>
<tspan x="1730.0" dy="25">Scoped arrival count · implemented</tspan>
</text>
</g>
<g id="evidence-state"><rect x="1520" y="865" width="420" height="135" rx="19" fill="#e7edf9" stroke="#8396ae" stroke-width="2.5"/>
<text x="1730.0" y="900" class="heading" text-anchor="middle">
<tspan x="1730.0" dy="0">Evidence artifacts</tspan>
</text>
<text x="1730.0" y="930" class="small" text-anchor="middle">
<tspan x="1730.0" dy="0">Source anchors + processor version</tspan>
<tspan x="1730.0" dy="25">Coverage / missing-content status</tspan>
<tspan x="1730.0" dy="25">Proposed</tspan>
</text>
</g>
<g id="analysis-state"><rect x="1520" y="1035" width="420" height="150" rx="19" fill="#e7edf9" stroke="#8396ae" stroke-width="2.5"/>
<text x="1730.0" y="1070" class="heading" text-anchor="middle">
<tspan x="1730.0" dy="0">Analysis runs &amp; results</tspan>
</text>
<text x="1730.0" y="1100" class="small" text-anchor="middle">
<tspan x="1730.0" dy="0">History boundary + input coverage</tspan>
<tspan x="1730.0" dy="25">Assessment / failure + resource use</tspan>
<tspan x="1730.0" dy="25">Proposed</tspan>
</text>
</g>
<text x="1730" y="1225" class="small" text-anchor="middle">
<tspan x="1730" dy="0">Keep source observations separate</tspan>
<tspan x="1730" dy="24">from model conclusions.</tspan>
<tspan x="1730" dy="24">Older results do not overwrite</tspan>
<tspan x="1730" dy="24">newer completed results.</tspan>
</text>
<g id="intake"><rect x="490" y="245" width="420" height="105" rx="19" fill="#dcefd6" stroke="#659951" stroke-width="2.5"/>
<text x="700.0" y="280" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Record &amp; bind boundary</tspan>
</text>
<text x="700.0" y="310" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">Existing intake + history foundation</tspan>
<tspan x="700.0" dy="25">One scoped observed boundary per request</tspan>
</text>
</g>
<g id="prepare"><rect x="490" y="400" width="420" height="100" rx="19" fill="#fff3cb" stroke="#b78e28" stroke-width="2.5"/>
<text x="700.0" y="435" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Prepare evidence</tspan>
</text>
<text x="700.0" y="465" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">Read observed inputs + reusable artifacts</tspan>
<tspan x="700.0" dy="25">Declare the data needed by this run</tspan>
</text>
</g>
<g id="needs-readers"><polygon points="700,525.0 860.0,585 700,645.0 540.0,585" fill="#fff8df" stroke="#b78e28" stroke-width="2.5"/>
<text x="700" y="579" class="body" text-anchor="middle">
<tspan x="700" dy="0">Need attachment</tspan>
<tspan x="700" dy="26">processing?</tspan>
</text>
</g>
<g id="readers"><rect x="1010" y="525" width="320" height="150" rx="19" fill="#fff3cb" stroke="#b78e28" stroke-width="2.5"/>
<text x="1170.0" y="560" class="heading" text-anchor="middle">
<tspan x="1170.0" dy="0">Content readers</tspan>
</text>
<text x="1170.0" y="590" class="small" text-anchor="middle">
<tspan x="1170.0" dy="0">Image / audio / video / file</tspan>
<tspan x="1170.0" dy="25">Keep original provenance</tspan>
<tspan x="1170.0" dy="25">Track unavailable / failed items</tspan>
</text>
</g>
<g id="context"><rect x="490" y="735" width="420" height="100" rx="19" fill="#fff3cb" stroke="#b78e28" stroke-width="2.5"/>
<text x="700.0" y="770" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Build analysis context</tspan>
</text>
<text x="700.0" y="800" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">Observed history + available evidence</tspan>
<tspan x="700.0" dy="25">Preserve gaps and source references</tspan>
</text>
</g>
<g id="context-guard"><polygon points="700,860.0 875.0,920 700,980.0 525.0,920" fill="#fff8df" stroke="#b78e28" stroke-width="2.5"/>
<text x="700" y="914" class="body" text-anchor="middle">
<tspan x="700" dy="0">Usable context</tspan>
<tspan x="700" dy="26">within budget?</tspan>
</text>
</g>
<g id="assess"><rect x="490" y="1040" width="420" height="110" rx="19" fill="#fff3cb" stroke="#b78e28" stroke-width="2.5"/>
<text x="700.0" y="1075" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Joint assessment</tspan>
</text>
<text x="700.0" y="1105" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">One main model call initially</tspan>
<tspan x="700.0" dy="25">Assessment + supporting / counterevidence</tspan>
</text>
</g>
<g id="result-guard"><polygon points="700,1167.5 875.0,1230 700,1292.5 525.0,1230" fill="#fff8df" stroke="#b78e28" stroke-width="2.5"/>
<text x="700" y="1224" class="body" text-anchor="middle">
<tspan x="700" dy="0">Valid schema</tspan>
<tspan x="700" dy="26">and references?</tspan>
</text>
</g>
<g id="finalize"><rect x="490" y="1340" width="420" height="105" rx="19" fill="#fff3cb" stroke="#b78e28" stroke-width="2.5"/>
<text x="700.0" y="1375" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Finalize outcome</tspan>
</text>
<text x="700.0" y="1405" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">Commit validated assessment OR failure</tspan>
<tspan x="700.0" dy="25">Attach history boundary, status and coverage</tspan>
</text>
</g>
<g id="failure"><rect x="45" y="930" width="280" height="175" rx="19" fill="#fde9e6" stroke="#bf6559" stroke-width="2.5"/>
<text x="185.0" y="965" class="heading" text-anchor="middle">
<tspan x="185.0" dy="0">Failure outcome</tspan>
</text>
<text x="185.0" y="995" class="small" text-anchor="middle">
<tspan x="185.0" dy="0">No usable input / over budget</tspan>
<tspan x="185.0" dy="25">Model error / timeout</tspan>
<tspan x="185.0" dy="25">Invalid result / references</tspan>
<tspan x="185.0" dy="25">No benign verdict is inferred</tspan>
</text>
</g>
<g id="policy"><rect x="490" y="1520" width="420" height="90" rx="19" fill="#e7ddf1" stroke="#9975b4" stroke-width="2.5"/>
<text x="700.0" y="1555" class="heading" text-anchor="middle">
<tspan x="700.0" dy="0">Policy</tspan>
</text>
<text x="700.0" y="1585" class="small" text-anchor="middle">
<tspan x="700.0" dy="0">Decides warning behavior from the outcome</tspan>
</text>
</g>
<path id="norm-intake" d="M1220 155 V170 H700 V245" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<path id="intake-prepare" d="M700 350 V400" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<path id="prepare-decision" d="M700 500 V525" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<path id="decision-context" d="M700 645 V735" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="720" y="690" class="small" text-anchor="start">
<tspan x="720" dy="0">No</tspan>
</text>
<path id="decision-readers" d="M860 585 H1010" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="925" y="570" class="small" text-anchor="middle">
<tspan x="925" dy="0">Yes</tspan>
</text>
<path id="readers-context" d="M1170 675 V785 H910" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="1110" y="740" class="small" text-anchor="middle">
<tspan x="1110" dy="0">Evidence + coverage</tspan>
</text>
<path id="context-check" d="M700 835 V860" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<path id="context-assessment" d="M700 980 V1040" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="720" y="1018" class="small" text-anchor="start">
<tspan x="720" dy="0">Yes</tspan>
</text>
<path id="context-failure" d="M525 920 H185 V930" fill="none" stroke="#ae5147" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="365" y="899" class="small" text-anchor="middle">
<tspan x="365" dy="0">No</tspan>
</text>
<path id="assessment-validation" d="M700 1150 V1167" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<path id="validation-success" d="M700 1292 V1340" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="720" y="1323" class="small" text-anchor="start">
<tspan x="720" dy="0">Yes</tspan>
</text>
<path id="validation-failure" d="M525 1230 H185 V1105" fill="none" stroke="#ae5147" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="350" y="1209" class="small" text-anchor="middle">
<tspan x="350" dy="0">No</tspan>
</text>
<path id="assessment-failure" d="M490 1090 H375 V1020 H325" fill="none" stroke="#ae5147" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="407" y="1072" class="small" text-anchor="middle">
<tspan x="407" dy="0">Error</tspan>
</text>
<path id="failure-finalize" d="M45 1015 H32 V1393 H490" fill="none" stroke="#ae5147" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="296" y="1364" class="small" text-anchor="middle">
<tspan x="296" dy="0">Failure status</tspan>
</text>
<path id="finalize-policy" d="M700 1445 V1520" fill="none" stroke="#263b49" stroke-width="2.5"   marker-end="url(#arrow)"/>
<text x="930" y="1488" class="small" text-anchor="middle">
<tspan x="930" dy="0">Assessment when available + explicit execution status</tspan>
</text>
<path id="history-intake" d="M910 290 H1440 V767 H1520" fill="none" stroke="#557caa" stroke-width="2.5" stroke-dasharray="10 7" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="1125" y="275" class="small" text-anchor="middle">
<tspan x="1125" dy="0">Append observation / read prefix</tspan>
</text>
<path id="evidence-lookup" d="M1520 920 H1380 V450 H910" fill="none" stroke="#557caa" stroke-width="2.5" stroke-dasharray="10 7"  marker-end="url(#arrow)"/>
<text x="1110" y="436" class="small" text-anchor="middle">
<tspan x="1110" dy="0">Read eligible cached evidence</tspan>
</text>
<path id="reader-originals" d="M1500 355 H1400 V600 H1330" fill="none" stroke="#6b7987" stroke-width="2.5" stroke-dasharray="10 7"  marker-end="url(#arrow)"/>
<text x="1230" y="509" class="small" text-anchor="middle">
<tspan x="1230" dy="0">Authorized byte access</tspan>
</text>
<path id="reader-cache" d="M1330 630 H1360 V960 H1520" fill="none" stroke="#557caa" stroke-width="2.5" stroke-dasharray="10 7"  marker-end="url(#arrow)"/>
<text x="1350" y="1023" class="small" text-anchor="middle">
<tspan x="1350" dy="0">Store anchored reader outputs</tspan>
</text>
<path id="commit-state" d="M910 1393 H1455 V1110 H1520" fill="none" stroke="#557caa" stroke-width="2.5" stroke-dasharray="10 7"  marker-end="url(#arrow)"/>
<text x="1145" y="1378" class="small" text-anchor="middle">
<tspan x="1145" dy="0">Record outcome for this boundary</tspan>
</text>
<text x="1510" y="78" class="small" text-anchor="start">
<tspan x="1510" dy="0">Green: implemented foundation</tspan>
<tspan x="1510" dy="25">Yellow: proposed workflow</tspan>
<tspan x="1510" dy="25">Blue: state / storage</tspan>
<tspan x="1510" dy="25">Red: explicit failure path</tspan>
</text>
<text x="1015" y="1190" class="small" text-anchor="start">
<tspan x="1015" dy="0">Structural checks by code;</tspan>
<tspan x="1015" dy="26">semantic correctness still needs evaluation.</tspan>
</text>
<text x="1015" y="1285" class="small" text-anchor="start">
<tspan x="1015" dy="0">No silent history truncation.</tspan>
<tspan x="1015" dy="26">Missing attachments remain visible.</tspan>
</text>
<text x="35" y="1660" class="small" text-anchor="start">
<tspan x="35" dy="0">Code enforces scope, history boundary, resource limits and state commits. Reader calls may add model calls.</tspan>
</text>
<text x="35" y="1690" class="small" text-anchor="start">
<tspan x="35" dy="0">Models, reader implementations, budgets and result schema are not selected by this diagram.</tspan>
</text>
</svg>
