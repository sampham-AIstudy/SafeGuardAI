<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafeGuard | Conversations</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #162925; --muted: #4b655d; --green: #12594c; --line: #d9e4dd;
      --ground: #edf3ee; --paper: #fff; --warning: #7a331d; --warning-paper: #fff1e7;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink); background: var(--ground);
    }
    * { box-sizing: border-box; }
    body { margin: 0; line-height: 1.45; }
    [hidden] { display: none !important; }
    .masthead { border-bottom: 1px solid var(--line); background: var(--paper); }
    .shell { width: min(1190px, 100% - 3rem); margin-inline: auto; }
    .masthead .shell { display: flex; align-items: center; justify-content: space-between; gap: .75rem; min-height: 62px; }
    .brand { display: flex; align-items: center; gap: .65rem; color: var(--green); font-size: 1.08rem; font-weight: 750; }
    .mark { width: 18px; height: 21px; background: var(--green); clip-path: polygon(50% 0, 100% 16%, 94% 67%, 50% 100%, 6% 67%, 0 16%, 50% 0, 50% 24%, 21% 33%, 26% 57%, 50% 77%, 74% 57%, 79% 33%, 50% 24%); }
    .mode { color: var(--muted); font-size: .84rem; text-align: right; }
    main { padding-block: 1.5rem; }
    h1 { margin: 0; font-size: 1.19rem; letter-spacing: -.025em; }
    h2 { margin: 0; font-size: 1rem; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: .84rem; }
    .inbox { display: grid; grid-template-columns: minmax(220px, 25%) minmax(0, 1fr); min-height: 560px; height: min(790px, calc(100dvh - 110px)); border: 1px solid var(--line); border-radius: 16px; background: var(--paper); }
    .rooms { padding: 1.2rem .9rem; background: #f7f9f6; border-right: 1px solid var(--line); border-radius: 16px 0 0 16px; }
    .rooms h2 { margin: 0 .5rem .75rem; }
    .room-list { display: grid; gap: .3rem; }
    .room { display: flex; align-items: center; gap: .7rem; min-width: 0; padding: .55rem .6rem; border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: start; }
    .room:hover { background: #edf3ec; }
    .room[aria-pressed="true"] { color: var(--green); background: #e4f1e9; border-color: #c1d9cb; }
    .room[aria-disabled="true"] { cursor: wait; }
    .avatar { width: 34px; height: 34px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 10px; background: #e1efe5; color: #295845; font-size: .87rem; font-weight: 750; }
    .avatar.marketplace { color: #61482e; background: #f3e8d9; }
    .chat { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; min-height: 0; }
    .chat-header { grid-row: 1; display: flex; align-items: center; gap: .7rem; padding: .85rem clamp(.85rem, 3vw, 1.5rem); border-bottom: 1px solid var(--line); }
    #clear { margin-inline-start: auto; padding: .45rem .7rem; border: 1px solid #e5c4ba; border-radius: 8px; background: white; color: #853823; font-size: .8rem; }
    #clear:hover:not(:disabled) { background: #fff1e7; }
    #clear:disabled { opacity: .5; cursor: default; }
    .notice { grid-row: 2; display: grid; gap: .25rem; margin: .72rem clamp(.85rem, 3vw, 1.5rem) 0; padding: .65rem .85rem; border: 1px solid #edcbb6; border-radius: 9px; background: var(--warning-paper); color: var(--warning); overflow-wrap: anywhere; }
    .notice p { font-size: .91rem; }
    .references { display: flex; flex-wrap: wrap; gap: .3rem .85rem; }
    .references a { color: inherit; font-size: .86rem; font-weight: 650; text-underline-offset: .15em; }
    .transcript { grid-row: 3; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 1.1rem clamp(.85rem, 3vw, 1.5rem); }
    .empty { padding-block: .6rem; }
    ol { display: grid; gap: 1rem; list-style: none; padding: 0; margin: 0; }
    .message { max-width: min(82%, 38rem); justify-self: start; overflow-wrap: anywhere; border-radius: 10px; }
    .message.outgoing { justify-self: end; }
    .sender { display: block; margin: 0 .35rem .2rem; font-size: .76rem; font-weight: 650; color: var(--muted); }
    .outgoing .sender { text-align: right; }
    .bubble { padding: .6rem .85rem; border: 1px solid #e4ebe5; border-radius: 5px 14px 14px 14px; background: #f0f4f0; }
    .outgoing .bubble { border-color: #c9e1d3; border-radius: 14px 5px 14px 14px; background: #e4f3ea; }
    .message.cited .bubble { border-color: #ce9275; background: var(--warning-paper); }
    .bubble p { white-space: pre-wrap; }
    .bubble .muted { margin-top: .32rem; }
    .attachment-image { display: block; max-width: min(100%, 23rem); max-height: 20rem; border-radius: 8px; }
    form { grid-row: 4; padding: .7rem clamp(.85rem, 3vw, 1.5rem); border-top: 1px solid var(--line); display: grid; gap: .45rem; }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem .75rem; }
    label { font-size: .79rem; font-weight: 650; }
    .tool { display: flex; align-items: center; gap: .34rem; max-width: 100%; }
    .compose-line { display: flex; align-items: end; gap: .55rem; }
    button, select, textarea, input { font: inherit; color: inherit; }
    select, textarea { max-width: 100%; border: 1px solid #9fb4a9; border-radius: 8px; background: white; padding: .45rem .65rem; }
    select { font-size: .82rem; }
    button, select { min-height: 44px; }
    button { cursor: pointer; font-weight: 680; }
    textarea { flex: 1 1 auto; width: 100%; min-width: 0; min-height: 44px; max-height: 8.2rem; resize: vertical; }
    #attachment { min-width: 0; max-width: 195px; font-size: .8rem; }
    #attachment::file-selector-button { min-height: 44px; margin-right: .35rem; padding: .35rem .55rem; border: 1px solid #9fb4a9; border-radius: 8px; background: white; color: var(--ink); cursor: pointer; }
    #send { flex: 0 0 auto; padding: .45rem 1rem; border: 1px solid var(--green); border-radius: 9px; background: var(--green); color: white; }
    #send:hover:not(:disabled) { background: #0e473d; }
    #send:disabled { opacity: .58; cursor: default; }
    :focus-visible { outline: 3px solid var(--green); outline-offset: 3px; }
    #activity { min-height: 1.25em; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 720px) {
      .shell { width: calc(100% - 1.25rem); }
      .masthead .shell { min-height: 50px; }
      main { padding-block: .65rem; }
      .inbox { grid-template-columns: minmax(0, 1fr); min-height: 0; height: auto; border-radius: 12px; }
      .rooms { padding: .65rem .75rem; border-right: 0; border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; }
      .rooms h2 { margin: 0 0 .35rem; font-size: .84rem; }
      .room-list { display: flex; flex-wrap: wrap; }
      .room { padding-block: .25rem; }
      .room .avatar { width: 27px; height: 27px; }
      .chat { grid-template-rows: auto auto minmax(150px, auto) auto; }
      .transcript { max-height: 42dvh; }
      .message { max-width: 91%; }
      .tools { column-gap: .55rem; }
    }
  </style>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead"><div class="shell"><div class="brand"><span class="mark" aria-hidden="true"></span>SafeGuard</div><span class="mode" id="mode">Local demo</span></div></header>
  <main class="shell">
    <div class="inbox">
      <nav class="rooms" aria-labelledby="conversation-label">
        <h2 id="conversation-label">Conversations</h2>
        <div class="room-list" id="rooms"></div>
      </nav>
      <section class="chat" aria-labelledby="room-title">
        <header class="chat-header">
          <span id="room-avatar" class="avatar" aria-hidden="true"></span>
          <div><h1 id="room-title">Conversations</h1><p class="muted" id="thread-status" aria-live="polite">Loading…</p></div>
          <button id="clear" type="button" hidden disabled>Clear messages</button>
        </header>
        <div id="notice" class="notice" aria-live="polite" hidden></div>
        <div id="transcript" class="transcript" role="region" aria-label="Conversation history" tabindex="0">
          <p id="empty" class="muted empty">Loading conversation…</p>
          <ol id="messages" aria-label="Observed messages"></ol>
        </div>
        <form id="composer">
          <div class="tools">
            <div class="tool"><label for="sender">Send as</label><select id="sender" disabled><option>You</option><option>Demo contact</option></select></div>
            <div class="tool" id="sample-tool" hidden><label class="visually-hidden" for="sample">Sample message</label><select id="sample" disabled><option value="">Choose a sample</option></select></div>
            <label class="visually-hidden" id="attachment-label" for="attachment">Attachment</label><input id="attachment" type="file" disabled><span id="attachment-limit" class="muted"></span>
          </div>
          <div class="compose-line">
            <label class="visually-hidden" for="body">Message text</label>
            <textarea id="body" rows="1" maxlength="8192" placeholder="Write a message…" disabled></textarea>
            <button id="send" type="submit" disabled>Send</button>
          </div>
          <p id="activity" class="muted" role="status"></p>
          <p id="live-data-note" class="muted" hidden>Use test data only. Messages from Demo contact and their supported evidence can be sent to Gemini.</p>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
